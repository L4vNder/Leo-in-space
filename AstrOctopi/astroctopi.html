<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>AstrOctopi – crew health companion</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c12;--card:#161826;--card2:#1e2132;--ink:#f4efe0;--mut:#9aa0b8;--acc:#f6e7a6;--on:#14151f;--acc2:#a9c8e8;--g:#8fd8a8;--y:#f2cf6b;--r:#ff7b7b;--line:#2a2e45;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f2f8fd;--card:#fff;--card2:#e6f1fb;--ink:#1b2a3f;--mut:#5f7189;--acc:#7fb4e6;--on:#0e2238;--acc2:#3d77b3;--g:#2f9e5f;--y:#c9921a;--r:#d9453f;--line:#cfe0f0;color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Nunito,system-ui,sans-serif;min-height:100vh;background-image:radial-gradient(1.5px 1.5px at 12% 18%,var(--acc) 50%,transparent),radial-gradient(1px 1px at 78% 12%,var(--acc2) 50%,transparent),radial-gradient(1.5px 1.5px at 90% 70%,var(--acc) 50%,transparent),radial-gradient(1px 1px at 30% 85%,var(--acc2) 50%,transparent),radial-gradient(1px 1px at 55% 40%,var(--acc) 50%,transparent);background-attachment:fixed}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}
h1,h2,h3{margin:0 0 8px;font-weight:800}h1{font-size:2rem}h2{font-size:1.3rem}h3{font-size:1.05rem}
.mut{color:var(--mut)}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.btn,.key{background:var(--acc);color:var(--on);border:0;border-radius:999px;padding:9px 18px;font:800 .95rem Nunito,sans-serif;cursor:pointer}
.btn.ghost{background:var(--card2);color:var(--ink)}.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.crew{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.who{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px 10px;text-align:center;cursor:pointer;color:var(--ink);font:inherit}
.who:hover{border-color:var(--acc)}.who .av{font-size:3.4rem;line-height:1.2}.who b{display:block}
.tile{background:var(--card2);border-radius:18px;padding:12px;position:relative;border:2px solid transparent}
.tile.r{border-color:var(--r)}.tile.y{border-color:var(--y)}.tile.g{border-color:transparent}
.tile .v{font-size:1.5rem;font-weight:800}.tile .u{font-size:.8rem;color:var(--mut)}
.bang{position:absolute;top:8px;right:8px;background:var(--r);color:#fff;width:22px;height:22px;border-radius:50%;text-align:center;font-weight:800;line-height:22px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}.g .dot,.dot.g{background:var(--g)}.y .dot,.dot.y{background:var(--y)}.r .dot,.dot.r{background:var(--r)}
.chip{font-size:.8rem;font-weight:700;color:var(--mut)}
.alert{background:color-mix(in srgb,var(--r) 18%,var(--card));border:2px solid var(--r);border-radius:18px;padding:12px 16px;margin-bottom:14px}
.note{background:color-mix(in srgb,var(--acc2) 16%,var(--card));border-radius:18px;padding:12px 16px;margin-bottom:14px}
.nav{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}.nav button{white-space:nowrap}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.row:last-child{border:0}
input,select{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font:inherit;width:110px}
.bar{height:12px;border-radius:9px;background:var(--card2);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc2);border-radius:9px}
.bars{display:flex;gap:8px;align-items:flex-end;height:90px}.bars div{flex:1;background:var(--acc2);border-radius:8px 8px 0 0;text-align:center;font-size:.75rem;color:var(--on);min-height:14px}
#modal{display:none;position:fixed;inset:0;background:#000a;z-index:20;align-items:center;justify-content:center;padding:16px}#modal.open{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px;max-width:380px;width:100%;max-height:90vh;overflow:auto;text-align:center}
.dots i{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid var(--acc);margin:6px}.dots i.on{background:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.key{background:var(--card2);color:var(--ink);font-size:1.3rem;padding:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));background:var(--acc);color:var(--on);padding:12px 18px;border-radius:18px;z-index:30;max-width:92vw;display:none;font-weight:700}
.avs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}.avs button{font-size:1.8rem;background:var(--card2);border:2px solid transparent;border-radius:16px;cursor:pointer}.avs button.sel{border-color:var(--acc)}
.rt{display:block;width:100%;padding:30px;border-radius:18px;border:0;background:var(--card2);color:var(--ink);font:800 1.1rem Nunito,sans-serif;cursor:pointer}.rt.go{background:var(--y);color:#222}
.orb{width:120px;height:120px;border-radius:50%;background:var(--acc2);margin:16px auto;display:flex;align-items:center;justify-content:center;color:var(--on);font-weight:800;transition:transform 4s ease-in-out}
.lyra{display:flex;gap:12px;align-items:center}.lyra span{font-size:2.2rem}
.opts{display:flex;gap:6px}.opts button{flex:1;padding:8px 0}.opts button.sel{background:var(--acc);color:var(--on)}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}.tw{overflow-x:auto}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;margin:3px}.items{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}.btn.sel{background:var(--acc);color:var(--on)}.octo svg{display:block;margin:auto}@keyframes bob{50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:no-preference){.octo svg{animation:bob 3s ease-in-out infinite}}
@media(prefers-reduced-motion:reduce){.orb{transition:none}}
</style></head><body>
<div id="toast"></div><div id="modal"></div><div class="wrap" id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AV=['🚀','🌙','⭐','🪐','🛰️','🌍','☄️','🦊','🐙','🐼','🌻','🍄'];
const M=[{k:'hr',n:'Heart rate',u:'bpm',g:[60,100],y:[50,120],d:[72,6]},{k:'sys',n:'Blood pressure (systolic)',u:'mmHg',g:[90,120],y:[80,139],d:[112,6]},{k:'spo2',n:'Blood oxygen',u:'%',g:[95,100],y:[92,100],d:[97,1]},{k:'temp',n:'Core temperature',u:'°C',g:[36.1,37.5],y:[35.5,38],d:[36.8,.3]},{k:'glu',n:'Blood sugar',u:'mg/dL',g:[70,110],y:[60,140],d:[92,10]},{k:'co2',n:'Cabin CO₂ exposure',u:'ppm',g:[0,3000],y:[0,5000],d:[2400,400]},{k:'rad',n:'Radiation dose',u:'mSv/day',g:[0,.8],y:[0,1.5],d:[.6,.1]}];
const C=['g','y','r'],L=['Healthy','Getting risky','Dangerous'];
const sv=(m,v)=>v>=m.g[0]&&v<=m.g[1]?0:v>=m.y[0]&&v<=m.y[1]?1:2,slS=h=>h>=7?0:h>=5.5?1:2,mdS=s=>s>=65?0:s>=45?1:2;
const TECH=[{t:'Military sleep method',s:['Relax your whole face, jaw and tongue.','Drop your shoulders, then let each arm go heavy.','Exhale and relax your chest, then legs from thighs to feet.','Clear your mind for 10 seconds: picture a calm lake or a hammock in a dark room.','If thoughts creep in, repeat "don’t think" for 10 seconds.']},{t:'4‑7‑8 breathing',p:[4,7,8],s:['Breathe in through your nose for 4.','Hold for 7.','Breathe out slowly for 8.','Repeat 4 times.']},{t:'Box breathing',p:[4,4,4],s:['In for 4, hold for 4, out for 4. Repeat for two minutes.']},{t:'Muscle release in your sleep restraint',s:['Tense then release each muscle group from toes to face.','Let the restraint hold you; no need to hold yourself.','Keep light dim and warm; use earplugs and an eye mask.']}];
const PLAY=[{t:'Rose, thorn, bud',q:['Share one good thing from today (rose).','Share one thing that was hard (thorn).','Share something you look forward to (bud).','What is one small thing a crewmate did that helped you this week?']},{t:'Two truths and a lie',q:['Take turns: say three things about your life, one is false. Others guess.','Make yours about Earth, before the mission.','Make yours about the funniest thing that happened up here.']},{t:'Pass the story',q:['Start a story with one sentence. Each person adds one sentence.','Theme: the crew finds a mysterious plant on the station.','Theme: the first picnic on Mars.']},{t:'Earth talk',q:['Describe a smell you miss from home.','Describe the meal you will cook first when you land.','Which place on Earth did you spot from the window today?']}];
const FOOD0=[['Oatmeal and berries',380,12,24],['Chicken and rice',520,28,18],['Beef stew pouch',480,30,14],['Tortilla and peanut butter',420,14,30],['Dried apple slices',110,1,40],['Protein bar',200,20,36],['Vegetable soup',220,8,20],['Cheese and crackers',300,11,5]].map(a=>({n:a[0],kcal:a[1],p:a[2],q:a[3]}));
const today=()=>new Date().toDateString();
function mk(id,name,role,av,pin,v,mood){return{id,name,role,av,pin,v,ts:Date.now()-36e5,sl:[{h:7.5,q:4},{h:6.8,q:3},{h:7,q:4},{h:6,q:3},{h:7.2,q:4}],water:0,eat:[],ex:[],mood:[mood],rt:[310,295],dg:[],day:today()}}
const base=()=>({hr:72,sys:112,spo2:97,temp:36.8,glu:92,co2:2400,rad:.6});
function seed(){return{crew:[mk(1,'Mira Okafor','Commander','🌙','1111',base(),72),mk(2,'Jonas Weiss','Flight engineer','🪐','2222',{...base(),spo2:91,hr:108},40),mk(3,'Aiko Tanaka','Medical officer','🦊','3333',{...base(),sys:126},52)],inv:FOOD0,tank:140,cmd:'0000',share:false,every:4}}
function load(){try{const s=localStorage.getItem('orbitcare');if(s)return JSON.parse(s)}catch(e){}return seed()}
function save(){try{localStorage.setItem('orbitcare',JSON.stringify(S))}catch(e){}}
let S=load(),cur=null,tab='Today',cmd=false,tm=null,rtS='idle',rt0,rtT;
S.crew.forEach(c=>{if(c.day!==today()){c.day=today();c.water=0;c.eat=[];c.ex=[]}});
const P=()=>S.crew.find(x=>x.id==cur),lm=c=>c.mood.length?c.mood.at(-1):null;
function alerts(c){const a=[];M.forEach(m=>{if(sv(m,c.v[m.k])==2)a.push(m.n+': '+c.v[m.k]+' '+m.u)});const l=c.sl.at(-1);if(l&&slS(l.h)==2)a.push('Sleep: '+l.h+' h');const d=lm(c);if(d!=null&&mdS(d)==2)a.push('Mood check is low');return a}
const worst=c=>Math.max(0,...M.map(m=>sv(m,c.v[m.k])),slS(c.sl.at(-1)?.h??8),mdS(lm(c)??100));
function tension(){const m=S.crew.map(lm).filter(x=>x!=null);return m.length&&m.reduce((a,b)=>a+b,0)/m.length<60}
function toast(h){const t=$('#toast');t.innerHTML=h;t.style.display='block';clearTimeout(tm);tm=setTimeout(()=>t.style.display='none',7000)}
function remind(c,k){const R={vit:['it’s time for your vitals check','two short pulses'],water:['please drink some water','one long pulse'],sleep:['time to wind down for sleep','three soft pulses']}[k];toast(`🔊 Cabin announcement for ${esc(c.name)}: ${R[0]}.<br>⌚ ${esc(c.name)}’s wrist band: ${R[1]}`);try{speechSynthesis.speak(new SpeechSynthesisUtterance(c.name+', '+R[0]))}catch(e){}}
setInterval(()=>S.crew.forEach(c=>{if(Date.now()-c.ts>S.every*36e5&&!c.rem){c.rem=1;remind(c,'vit')}}),30000);
function closeM(){$('#modal').classList.remove('open');$('#modal').innerHTML=''}
function sheet(h){const m=$('#modal');m.innerHTML=`<div class=sheet>${h}</div>`;m.classList.add('open')}
function pin(title,sub,check,done){let v='';const draw=msg=>{sheet(`<h3>${title}</h3><p class=mut>${msg||sub}</p><div class=dots>${[0,1,2,3].map(i=>`<i class="${i<v.length?'on':''}"></i>`).join('')}</div><div class=pad>${[1,2,3,4,5,6,7,8,9,'✕',0,'⌫'].map(k=>`<button class=key data-k="${k}">${k}</button>`).join('')}</div>`);document.querySelectorAll('.key').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k=='✕')return closeM();if(k=='⌫')v=v.slice(0,-1);else if(v.length<4)v+=k;if(v.length==4){if(check(v)){closeM();done();return}v='';return draw('Wrong code. Try again.')}draw()})};draw()}
function open_(id){const c=S.crew.find(x=>x.id==id);pin(c.av+' '+esc(c.name),'Enter your 4‑digit code',v=>v==c.pin,()=>{cur=id;tab='Today';render()})}
function openCmd(){pin('Command console','Authorized personnel only',v=>v==S.cmd,()=>{cmd=true;render()})}
function addCrew(){let av=AV[0];window.pickAv=a=>{av=a;document.querySelectorAll('.avs button').forEach(b=>b.classList.toggle('sel',b.textContent==a))};window.saveCrew=()=>{const n=$('#cn').value.trim(),p=$('#cp').value;if(!n||!/^\d{4}$/.test(p))return toast('Add a name and a 4‑digit code.');S.crew.push(mk(Date.now(),n,$('#cr').value||'Crew',av,p,base(),75));save();closeM();render()};sheet(`<h3>Add a crew member</h3><p class=mut>Pick a profile picture before launch.</p><div class=avs>${AV.map(a=>`<button onclick="pickAv('${a}')" class="${a==av?'sel':''}">${a}</button>`).join('')}</div><p><input id=cn placeholder="Name" maxlength=24 style="width:100%"></p><p><input id=cr placeholder="Role" maxlength=24 style="width:100%"></p><p><input id=cp placeholder="4‑digit code" inputmode=numeric maxlength=4 style="width:100%"></p><button class=btn onclick="saveCrew()">Save</button> <button class="btn ghost" onclick="closeM()">Cancel</button>`)}
function changeAv(){window.setAv=a=>{P().av=a;save();closeM();render()};sheet(`<h3>Choose your picture</h3><div class=avs>${AV.map(a=>`<button onclick="setAv('${a}')">${a}</button>`).join('')}</div>`)}
function team(){const a=PLAY[Math.floor(Math.random()*PLAY.length)];let i=0;window.nextQ=()=>{i=(i+1)%a.q.length;$('#tq').textContent=a.q[i]};window.otherA=()=>{closeM();team()};sheet(`<h3>Team time: ${a.t}</h3><p class=mut>Gather in the common area. About 10 minutes.</p><p id=tq class=note>${a.q[0]}</p><button class=btn onclick="nextQ()">Next prompt</button> <button class="btn ghost" onclick="otherA()">Another activity</button> <button class="btn ghost" onclick="closeM()">Done</button>`)}
const tile=(n,v,u,s,bang)=>`<div class="tile ${C[s]}">${bang&&s==2?'<span class=bang>!</span>':''}<div class=u><i class=dot></i>${n}</div><div class=v>${v}<span class=u> ${u}</span></div><div class=chip>${L[s]}</div></div>`;
function home(){const t=tension();return`<div class=top><div><h1>AstrOctopi 🐙</h1><div class=mut>Who is checking in?</div></div><div><button class="btn ghost" onclick="theme()">Light / dark</button> <button class=btn onclick="openCmd()">Command console</button></div></div>
${t?`<div class=note><b>The crew mood has been dipping.</b> A short activity together can help everyone relax. <button class=btn onclick="team()" style="margin-left:8px">Start team time</button></div>`:`<div class=note>Crew mood looks steady. <button class="btn ghost" onclick="team()">Team time anyway</button></div>`}
<div class=crew>${S.crew.map(c=>`<button class=who onclick="open_(${c.id})"><div class="av octo">${oct(petOf(c),88)}</div><b>${esc(c.name)}</b><span class=mut>${esc(c.role)}</span></button>`).join('')}<button class=who onclick="addCrew()"><div class=av>＋</div><b>Add crew</b><span class=mut>Before launch</span></button></div>
<p class=chip>Demo codes: Mira 1111, Jonas 2222, Aiko 3333, Command 0000. Profiles are private by default.</p>`}
function stats(c){const l=c.sl.at(-1),d=lm(c);const al=alerts(c);const due=Date.now()-c.ts>S.every*36e5;
return`${petCard(c)}${al.length?`<div class=alert><b>! Attention needed</b><br>${al.map(esc).join('<br>')}<br><span class=mut>Notify the medical officer or flight surgeon.</span></div>`:''}${due?`<div class=note>Your vitals check is due.</div>`:''}
<div class=grid>${['hr','spo2','sys','temp'].map(k=>{const m=M.find(x=>x.k==k);return tile(m.n,c.v[k],m.u,sv(m,c.v[k]),1)}).join('')}${tile('Last sleep',l?l.h:'–','h',l?slS(l.h):0,1)}${tile('Mood',d==null?'–':d,'/100',d==null?0:mdS(d),1)}${tile('Water today',c.water,'ml',Math.min(1,c.water>=1500?0:1),0)}${tile('Nutrition',nut(c),'/100',nut(c)>=60?0:1,0)}</div>
${S.share?`<div class=card style="margin-top:14px"><h3>Crew status (sharing on)</h3>${S.crew.map(x=>`<div class=row><span>${x.av} ${esc(x.name)}</span><span><i class="dot ${C[worst(x)]}"></i>${L[worst(x)]}</span></div>`).join('')}</div>`:''}`}
function vitals(c){return`<div class=card><div class=top><div><h2>Physiological metrics</h2><span class=mut>Last logged ${new Date(c.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}. Checks every ${S.every} h.</span></div><button class=btn onclick="sync()">Sync wrist monitor</button></div>${M.map(m=>{const s=sv(m,c.v[m.k]);return`<div class=row><span><i class="dot ${C[s]}"></i><b>${m.n}</b><br><span class=chip>Green ${m.g[0]}–${m.g[1]} ${m.u}. ${L[s]}</span></span><span><b style="font-size:1.3rem">${c.v[m.k]}</b> ${m.u} <input id=in_${m.k} type=number step=any placeholder="New"> <button class="btn ghost" onclick="logV('${m.k}')">Log</button></span></div>`}).join('')}</div>`}
function sleep(c){const l=c.sl.slice(-7),avg=l.reduce((a,b)=>a+b.h,0)/l.length,rec=Math.min(100,Math.round(avg/8*60+l.reduce((a,b)=>a+b.q,0)/l.length/5*40));
return`<div class=card><h2>Rest and recovery</h2><p>Recovery score <b>${rec}</b>/100. Average ${avg.toFixed(1)} h a night. Aim for 7 or more.</p><div class=bars>${l.map(x=>`<div style="height:${x.h*10}%">${x.h}</div>`).join('')}</div>
<div class=row><span>Log last night: <input id=sh type=number step=.5 placeholder="Hours"> Quality <input id=sq type=number min=1 max=5 placeholder="1–5" style="width:70px"></span><button class=btn onclick="logS()">Save</button></div></div>
<div class=card><h2>Techniques to fall asleep</h2>${TECH.map((t,i)=>`<details class=row style="display:block"><summary><b>${t.t}</b></summary><ol>${t.s.map(x=>`<li>${x}</li>`).join('')}</ol>${t.p?`<button class=btn onclick="breathe(${i})">Start guided breathing</button>`:''}</details>`).join('')}<div id=orbw></div></div>`}
let bt;function breathe(i){const p=TECH[i].p,st=['Breathe in','Hold','Breathe out'];let n=0,rounds=0;clearTimeout(bt);$('#orbw').innerHTML='<div class=orb id=orb></div><div style="text-align:center"><button class="btn ghost" onclick="clearTimeout(bt);$(\'#orbw\').innerHTML=\'\'">Stop</button></div>';const go=()=>{const o=$('#orb');if(!o)return;o.textContent=st[n];o.style.transitionDuration=p[n]+'s';o.style.transform=n==0?'scale(1.5)':n==1?'scale(1.5)':'scale(1)';bt=setTimeout(()=>{n=(n+1)%3;if(!n&&++rounds>=4){o.textContent='Well done';return}go()},p[n]*1000)};go()}
function nut(c){const k=c.eat.reduce((a,b)=>a+b.kcal,0),p=c.eat.reduce((a,b)=>a+b.p,0);return Math.round(Math.min(k/2800,1)*40+Math.min(p/90,1)*30+Math.min(c.water/2500,1)*30)}
function fuel(c){const p=c.eat.reduce((a,b)=>a+b.p,0),k=c.eat.reduce((a,b)=>a+b.kcal,0);const cand=S.inv.filter(i=>i.q>0&&c.eat.filter(e=>e.n==i.n).length<2).sort((a,b)=>(b.q+(p<60?b.p*2:0))-(a.q+(p<60?a.p*2:0)))[0];
return`<div class=card><h2>Nutrition score ${nut(c)}/100</h2><div class=bar><i style="width:${nut(c)}%"></i></div><p class=mut>${k} of 2800 kcal. ${p} of 90 g protein. ${c.water} of 2500 ml water.</p>${cand?`<div class=note>Suggested next meal: <b>${cand.n}</b> (${cand.kcal} kcal, ${cand.p} g protein).</div>`:''}
<div class=row><span><b>Water</b> <span class=chip>Reserve: ${S.tank.toFixed(1)} L${S.tank<40?' (low)':''}</span></span><span><button class=btn onclick="drink()">+250 ml</button> <button class="btn ghost" onclick="remind(P(),'water')">Test reminder</button></span></div></div>
<div class=card><h2>Food on board</h2>${S.inv.map((i,x)=>`<div class=row><span>${i.n}<br><span class=chip>${i.kcal} kcal. ${i.p} g protein. ${i.q} left${i.q<8?' (running low)':''}</span></span><button class="btn ghost" ${i.q?'':'disabled'} onclick="eat(${x})">I ate this</button></div>`).join('')}</div><div class=card><h3>Today’s log</h3>${c.eat.length?c.eat.map(e=>esc(e.n)).join(', '):'<span class=mut>Nothing logged yet.</span>'}</div>`}
function move(c){const light=worst(c)>0||(c.sl.at(-1)?.h??8)<5.5,f=light?.5:1,pl=[['Treadmill run (harnessed)',30],['Resistance device (squats, deadlift, press)',45],['Cycle ergometer',30],['Mobility and stretching',15]];const done=c.ex.length;
return`<div class=card><h2>${light?'Light day':'Full day'}: about ${Math.round(pl.reduce((a,b)=>a+b[1],0)*f)} min</h2><p class=mut>${light?'Your metrics or sleep say go easy. Cut each block in half, keep the intensity low, and check with the medical officer if you feel unwell.':'Daily exercise protects muscle and bone in microgravity.'}</p>${pl.map((x,i)=>`<div class=row><label><input type=checkbox style="width:auto" ${c.ex.includes(i)?'checked':''} onchange="exer(${i})"> ${x[0]}</label><b>${Math.round(x[1]*f)} min</b></div>`).join('')}<div class=bar><i style="width:${done/4*100}%"></i></div></div>`}
const Q=['I felt calm and relaxed','I had energy for my tasks','I felt connected to my crewmates','I could focus well','I felt hopeful about the days ahead'];let ans=[];
function mind(c){const d=lm(c),r=c.rt.slice(-5),dg=c.dg.slice(-5);
return`<div class=card><h2>Mood check</h2><p class=mut>Rate each statement: 0 not at all, 3 very much.</p>${Q.map((q,i)=>`<div class=row><span>${q}</span><span class=opts>${[0,1,2,3].map(n=>`<button class="btn ghost ${ans[i]===n?'sel':''}" onclick="ans[${i}]=${n};render()">${n}</button>`).join('')}</span></div>`).join('')}<p><button class=btn onclick="saveMood()">Save mood check</button> <span class=mut>Latest score: ${d==null?'none':d+'/100'}</span></p>${d!=null&&d<45?'<div class=note>You’ve had a hard stretch. Consider talking with the medical officer or a ground psychologist. Reaching out is part of the mission.</div>':''}</div>
<div class=card><h2>Reaction test</h2><button class=rt id=rt onclick="rtClick()">Tap to start. Tap again when the button turns yellow.</button><p class=mut>Recent: ${r.join(', ')||'none'} ms</p></div>
<div class=card><h2>Memory test</h2><div id=dgb><button class=btn onclick="dgo()">Show 5 digits</button></div><p class=mut>Recent results: ${dg.map(x=>x?'✓':'✗').join(' ')||'none'}</p></div>`}
function saveMood(){if(ans.filter(x=>x!=null).length<5)return toast('Answer all five statements first.');P().mood.push(Math.round(ans.reduce((a,b)=>a+b,0)/15*100));ans=[];save();render()}
function rtClick(){const b=$('#rt');if(rtS=='idle'){rtS='wait';b.textContent='Wait for yellow…';rtT=setTimeout(()=>{rtS='go';b.className='rt go';b.textContent='Tap now!';rt0=performance.now()},1200+Math.random()*2500)}else if(rtS=='wait'){clearTimeout(rtT);rtS='idle';b.textContent='Too soon. Tap to try again.'}else{P().rt.push(Math.round(performance.now()-rt0));rtS='idle';save();render()}}
function dgo(){const n=Array.from({length:5},()=>Math.floor(Math.random()*10)).join('');$('#dgb').innerHTML=`<b style="font-size:2rem;letter-spacing:6px">${n}</b>`;setTimeout(()=>{$('#dgb').innerHTML=`<input id=dgi inputmode=numeric maxlength=5 placeholder="Digits"> <button class=btn onclick="dgc('${n}')">Check</button>`},2200)}
function dgc(n){const ok=$('#dgi').value==n;P().dg.push(ok?1:0);save();toast(ok?'Correct. Nicely done.':'Not quite. It was '+n);render()}
function logV(k){const x=parseFloat($('#in_'+k).value);if(isNaN(x))return;const c=P();c.v[k]=x;c.ts=Date.now();c.rem=0;save();render()}
function sync(){const c=P();M.forEach(m=>{c.v[m.k]=+(m.d[0]+(Math.random()-.5)*2*m.d[1]).toFixed(m.k=='temp'?1:m.k=='rad'?2:0)});c.ts=Date.now();c.rem=0;save();toast('⌚ Wrist monitor synced.');render()}
function logS(){const h=parseFloat($('#sh').value),q=parseInt($('#sq').value);if(isNaN(h)||!(q>=1&&q<=5))return toast('Enter hours and a quality from 1 to 5.');P().sl.push({h,q});save();render()}
function drink(){const c=P();c.water+=250;S.tank=Math.max(0,S.tank-.25);save();render()}
function eat(i){const c=P(),f=S.inv[i];if(f.q<1)return;f.q--;c.eat.push({n:f.n,kcal:f.kcal,p:f.p});save();render()}
function exer(i){const c=P();c.ex=c.ex.includes(i)?c.ex.filter(x=>x!=i):[...c.ex,i];save();render()}
function theme(){const r=document.documentElement;r.dataset.theme=r.dataset.theme=='light'?'dark':'light'}
function console_(){return`<div class=top><h1>Command console</h1><div><button class="btn ghost" onclick="cmd=false;render()">Lock and exit</button></div></div><div class="card tw"><table><tr><th>Crew<th>Overall<th>HR<th>SpO₂<th>BP<th>Temp<th>Sleep<th>Mood<th>Alerts</tr>${S.crew.map(c=>{const l=c.sl.at(-1),d=lm(c),a=alerts(c);return`<tr><td>${c.av} ${esc(c.name)}<td><i class="dot ${C[worst(c)]}"></i>${L[worst(c)]}<td>${c.v.hr}<td>${c.v.spo2}<td>${c.v.sys}<td>${c.v.temp}<td>${l?l.h+' h':'–'}<td>${d??'–'}<td>${a.length?'<b style="color:var(--r)">! '+a.length+'</b>':'–'}</tr>`}).join('')}</table></div>
<div class=card><h3>Settings</h3><div class=row><span>Let crew see each other’s status</span><button class="btn ghost" onclick="S.share=!S.share;save();render()">${S.share?'On':'Off'}</button></div><div class=row><span>Vitals reminder every (hours)</span><input type=number min=1 value=${S.every} onchange="S.every=+this.value||4;save()"></div><div class=row><span>Test reminders</span><span>${S.crew.map(c=>`<button class="btn ghost" onclick="remind(S.crew.find(x=>x.id==${c.id}),'vit')">${c.av}</button>`).join(' ')}</span></div><div class=row><span>Reset demo data</span><button class="btn ghost" onclick="S=seed();save();render()">Reset</button></div></div>
<p class=chip>Demo only: codes are stored in this browser and are not secure. Not a medical device.</p>`}
function render(){rtS='idle';clearTimeout(bt);const a=$('#app');if(cmd)return a.innerHTML=console_();if(cur==null||!P())return a.innerHTML=home();const c=P(),T=['Today','Octo','Vitals','Sleep','Fuel','Move','Mind'],B={Octo:octo,Today:stats,Vitals:vitals,Sleep:sleep,Fuel:fuel,Move:move,Mind:mind};
a.innerHTML=`<div class=top><div class=lyra><span onclick="changeAv()" style="cursor:pointer" title="Change picture">${c.av}</span><div><h1>${tab=='Today'?'Hello, '+esc(c.name.split(' ')[0]):tab}</h1><span class=mut>${esc(c.role)}. Lyra says: ${worst(c)==2?'let’s look after you first.':worst(c)==1?'a few things to watch today.':'you’re doing great.'}</span></div></div><button class="btn ghost" onclick="cur=null;render()">Lock profile</button></div><div class=nav>${T.map(t=>`<button class="btn ${t==tab?'':'ghost'}" onclick="tab='${t}';render()">${t}</button>`).join('')}</div>${B[tab](c)}`}

const COLS=['#f6e7a6','#a9c8e8','#f4a6c0','#b9e5c0','#c9b6f2','#ffb88a','#f08a8a','#9fe0e0'];
const HATS=['None','Cowboy','Astronaut helmet','Top hat','Party hat','Chef hat','Crown','Beanie','Pirate hat','Wizard hat','Headphones'];
const ACCS=['None','Guitar','Monocle','Scooter','Bow tie','Sunglasses','Balloon','Cape','Telescope','Coffee mug','Star wand'];
const HAT=['','<ellipse cx=100 cy=42 rx=62 ry=10 fill=#9a6a3a /><path d="M68 42q0-34 32-34t32 34z" fill=#b07d45 /><path d="M70 36h60" stroke=#6b4423 stroke-width=4 />',
'<circle cx=100 cy=84 r=74 fill=#bfe3ff fill-opacity=.22 stroke=#fff stroke-width=5 /><path d="M50 52q22-24 54-24" stroke=#fff stroke-width=4 fill=none opacity=.7 stroke-linecap=round />',
'<rect x=64 y=38 width=72 height=8 rx=4 fill=#222 /><rect x=76 y=6 width=48 height=36 rx=4 fill=#2a2a38 /><rect x=76 y=30 width=48 height=7 fill=#c0392b />',
'<path d="M100 2l-26 44h52z" fill=#ff8fb8 /><circle cx=100 cy=4 r=6 fill=#ffe27a /><path d="M84 30h32M78 40h44" stroke=#fff stroke-width=3 />',
'<circle cx=78 cy=24 r=16 fill=#fff /><circle cx=100 cy=16 r=18 fill=#fff /><circle cx=122 cy=24 r=16 fill=#fff /><rect x=72 y=30 width=56 height=16 fill=#fff />',
'<path d="M68 46l-4-30 22 16 14-24 14 24 22-16-4 30z" fill=#ffd24a stroke=#d9a400 stroke-width=2 /><circle cx=100 cy=36 r=4 fill=#e5484d />',
'<path d="M56 50q4-42 44-42t44 42z" fill=#e5646b /><rect x=54 y=44 width=92 height=12 rx=6 fill=#c94a52 /><circle cx=100 cy=6 r=8 fill=#fff />',
'<path d="M54 46q6-36 46-36t46 36q-46-14-92 0z" fill=#22222e /><circle cx=100 cy=28 r=6 fill=#fff /><path d="M96 24l8 8M104 24l-8 8" stroke=#22222e stroke-width=2 />',
'<path d="M100 2l-30 44h60z" fill=#5b4bb7 /><ellipse cx=100 cy=46 rx=50 ry=8 fill=#4a3c9c /><circle cx=96 cy=28 r=3 fill=#ffe27a />',
'<path d="M48 84q0-52 52-52t52 52" stroke=#333 stroke-width=8 fill=none /><rect x=40 y=76 width=16 height=28 rx=7 fill=#f26b8a /><rect x=144 y=76 width=16 height=28 rx=7 fill=#f26b8a />'];
const ACC=['','<g transform="rotate(-25 40 150)"><rect x=38 y=96 width=6 height=62 fill=#7a4a24 /><ellipse cx=41 cy=170 rx=18 ry=22 fill=#d98c4a /><circle cx=41 cy=170 r=6 fill=#4a2a12 /></g>',
'<circle cx=118 cy=88 r=16 fill=none stroke=#d9a400 stroke-width=3 /><path d="M130 100q8 20 2 40" stroke=#d9a400 stroke-width=2 fill=none />',
'<rect x=118 y=178 width=60 height=6 rx=3 fill=#6fc3c3 /><circle cx=124 cy=190 r=7 fill=#333 /><circle cx=174 cy=190 r=7 fill=#333 /><path d="M170 180l-6-70" stroke=#6fc3c3 stroke-width=5 /><path d="M156 110h20" stroke=#333 stroke-width=5 />',
'<path d="M100 138l-18-10v20zM100 138l18-10v20z" fill=#e5484d /><circle cx=100 cy=138 r=4 fill=#b02a30 />',
'<rect x=64 y=78 width=30 height=20 rx=8 fill=#15151f /><rect x=106 y=78 width=30 height=20 rx=8 fill=#15151f /><path d="M94 86h12" stroke=#15151f stroke-width=3 />',
'<path d="M150 140Q160 110 168 82" stroke=#fff stroke-width=2 fill=none /><ellipse cx=168 cy=62 rx=16 ry=20 fill=#ff6f91 />',
'<path d="M60 110l-24 78h128l-24-78z" fill=#c0392b opacity=.9 />',
'<g transform="rotate(-30 150 150)"><rect x=120 y=140 width=60 height=14 rx=4 fill=#8a6a3a /><rect x=170 y=137 width=16 height=20 rx=3 fill=#c9a45a /><rect x=112 y=142 width=12 height=10 fill=#444 /></g>',
'<rect x=146 y=140 width=24 height=26 rx=4 fill=#fff /><path d="M170 146q12 2 0 14" stroke=#fff stroke-width=4 fill=none /><path d="M152 134q-3-8 3-12M162 134q-3-8 3-12" stroke=#fff opacity=.6 stroke-width=2 fill=none />',
'<path d="M150 190l22-60" stroke=#d9b26b stroke-width=4 /><path d="M176 112l5 10 11 1-8 8 2 11-10-6-10 6 2-11-8-8 11-1z" fill=#ffe27a />'];
function petOf(c){const p=c.pet||(c.pet={col:COLS[0],hat:0,acc:0,name:'Inky',h:75,m:75,life:100,t:Date.now(),pt:0}),dt=Math.min(72,(Date.now()-p.t)/36e5);p.t=Date.now();p.h=Math.max(0,p.h-2*dt);p.m=Math.max(0,p.m-1.5*dt);p.life=(p.h<=0||p.m<=0)?Math.max(0,p.life-4*dt):Math.min(100,p.life+3*dt);return p}
function oct(p,s=150){const c=p.col,dead=p.life<=0,md=p.m>60&&p.h>40?0:p.m>30&&p.h>20?1:2,D='#1b1d2b';
const tent=[[54,116,-1],[70,128,-1],[88,136,-.4],[112,136,.4],[130,128,1],[146,116,1]].map(([x,y,k])=>`<path d="M${x} ${y}q${k*14} 24 ${k*4} 40t${k*16} 20" stroke=${c} stroke-width=15 stroke-linecap=round fill=none />`).join('');
const eyes=dead?`<path d="M74 80l16 16M90 80l-16 16M110 80l16 16M126 80l-16 16" stroke=${D} stroke-width=3 stroke-linecap=round />`:`<circle cx=82 cy=88 r=11 fill=#fff /><circle cx=84 cy=90 r=5.5 fill=${D} /><circle cx=118 cy=88 r=11 fill=#fff /><circle cx=116 cy=90 r=5.5 fill=${D} />`;
const mouth=dead?`<ellipse cx=100 cy=110 rx=5 ry=3 fill=${D} />`:`<path d="${['M88 106q12 12 24 0','M90 108h20','M88 114q12-10 24 0'][md]}" stroke=${D} stroke-width=3 stroke-linecap=round fill=none />`;
return`<svg viewBox="0 0 200 200" width=${s} height=${s} role=img aria-label="Your octopus">${p.acc==7?ACC[7]:''}${tent}<ellipse cx=100 cy=84 rx=58 ry=54 fill=${c} /><ellipse cx=78 cy=56 rx=14 ry=8 fill=#fff opacity=.3 transform="rotate(-25 78 56)" />${eyes}<circle cx=66 cy=102 r=8 fill=#ff9bb5 opacity=.55 /><circle cx=134 cy=102 r=8 fill=#ff9bb5 opacity=.55 />${mouth}${HAT[p.hat]||''}${p.acc==7?'':ACC[p.acc]||''}</svg>`}
const bar=(n,v,c)=>`<div style="margin:6px 0"><div class=chip>${n} ${Math.round(v)}</div><div class=bar><i style="width:${v}%;background:${c}"></i></div></div>`;
const bars=p=>bar('Health',p.h,'var(--g)')+bar('Happiness',p.m,'var(--y)')+bar('Life ❤',p.life,'var(--r)');
function petMsg(p){return p.life<=0?'is resting. Any care wakes them up.':p.h<30?'is hungry for care: log water, a meal or your vitals.':p.m<30?'needs cheering up: try a mood check or a cuddle.':'is thriving.'}
function petCard(c){const p=petOf(c);return`<div class=card style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class=octo>${oct(p,110)}</div><div style="flex:1;min-width:180px"><h3>${esc(p.name)} ${petMsg(p)}</h3>${bars(p)}<button class="btn ghost" onclick="tab='Octo';render()">Visit ${esc(p.name)}</button></div></div>`}
function octo(c){const p=petOf(c);return`<div class=card style="text-align:center"><div class=octo>${oct(p,230)}</div><h2>${esc(p.name)} ${petMsg(p)}</h2><div style="max-width:360px;margin:auto;text-align:left">${bars(p)}</div><p><input id=pn value="${esc(p.name)}" maxlength=14 aria-label="Octopus name" onchange="setP('name',this.value.trim()||'Inky')"> <button class=btn onclick="pat()">Cuddle</button></p><p class=chip>Keep your octopus healthy and happy by caring for yourself: log vitals, sleep, water, meals, exercise and mood checks. If neglected, they get sleepy and need a few check-ins to wake up.</p></div>
<div class=card><h3>Color</h3><div class=items>${COLS.map(x=>`<button class=sw style="background:${x};border-color:${p.col==x?'var(--ink)':'transparent'}" onclick="setP('col','${x}')" aria-label="Color ${x}"></button>`).join('')}<input type=color value=${p.col} onchange="setP('col',this.value)" aria-label="Custom color" style="width:44px;height:34px;padding:0"></div>
<h3>Hats</h3><div class=items>${HATS.map((h,i)=>`<button class="btn ghost ${p.hat==i?'sel':''}" onclick="setP('hat',${i})">${h}</button>`).join('')}</div>
<h3>Accessories</h3><div class=items>${ACCS.map((h,i)=>`<button class="btn ghost ${p.acc==i?'sel':''}" onclick="setP('acc',${i})">${h}</button>`).join('')}</div></div>`}
function setP(k,v){petOf(P())[k]=v;save();render()}
function care(c,h,m){const p=petOf(c);if(p.life<=0)p.life=40;p.h=Math.min(100,p.h+h);p.m=Math.min(100,p.m+m);save()}
function pat(){const c=P(),p=petOf(c);if(Date.now()-p.pt<6e4)return toast(esc(p.name)+' is enjoying the cuddle. Try again in a minute.');p.pt=Date.now();care(c,0,5);render();toast('🐙 '+esc(p.name)+' wiggles happily')}
const snap=c=>[JSON.stringify(c.v),c.sl.length,c.water,c.eat.length,c.ex.length,c.mood.length,c.dg.length,c.rt.length],GAIN=[[8,0],[8,5],[6,0],[10,0],[10,6],[0,15],[0,5],[0,5]];
['logV','sync','logS','drink','eat','exer','saveMood','dgc','rtClick'].forEach(n=>{const f=window[n];window[n]=function(...a){const c=cur!=null?P():null,b=c&&snap(c);f.apply(this,a);if(!c)return;let h=0,m=0;snap(c).forEach((x,i)=>{if(i?x>b[i]:x!=b[i]){h+=GAIN[i][0];m+=GAIN[i][1]}});if(h||m){care(c,h,m);render();toast('💛 '+esc(petOf(c).name)+' feels cared for')}}});
if(matchMedia('(prefers-color-scheme: light)').matches)document.documentElement.dataset.theme='light';
render();
</script></body></html>
